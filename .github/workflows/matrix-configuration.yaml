name: Matrix Configuration
on:
  push:
  workflow_dispatch:
jobs:
    deploy:
      strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
          images: [hello-world, alpine]
          exclude:
            - images: alpine
              os: windows-latest
          include:
            - images: amd64/alpine
              os: ubuntu-24.04
      runs-on: ${{ matrix.os }}
      steps:
      - name: Echo docker details
        run: docker info
      - name: Run images
        run: docker run ${{ matrix.images }}
